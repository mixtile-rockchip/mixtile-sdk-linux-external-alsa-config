Syntax 3

SectionVerb {
    EnableSequence [
        # Global initialization
        # exec "/bin/sh -c \"echo '[UCM] SectionVerb EnableSequence: Initializing Hardware' > /dev/kmsg\""

        # Switch SDI mapping order for Speaker/Default mode
        cset "name='SAI1 Receive PATH0 Source Select' From SDI1"
        cset "name='SAI1 Receive PATH1 Source Select' From SDI2"
        cset "name='SAI1 Receive PATH2 Source Select' From SDI0"

        # Enable OUT2 (speaker), disable OUT1 (headphone)
        cset "name='OUT2 Switch' on"
        cset "name='OUT1 Switch' off"

        # Recover hardware loopback gain 0dB by default
        cset "name='PGA3_setting' 0"
        cset "name='PGA4_setting' 0"
    ]
    DisableSequence [
        # exec "/bin/sh -c \"echo '[UCM] SectionVerb DisableSequence' > /dev/kmsg\""
    ]
}

# Define Headphones Device
SectionDevice."Headphones" {
    Comment "Headphones Output"

    Value {
        PlaybackPriority 200
        JackName "rk730-es7210 Headset"
    }

    EnableSequence [
        # exec "/bin/sh -c \"echo '[UCM] Switching to Headphones: Enabling Mic, OUT1, and SDI0/1/2' > /dev/kmsg\""

        # Enable microphone logic switch
        cset "name='Headset Mic Switch' on"

        # Switch SDI mapping order for Headset mode
        cset "name='SAI1 Receive PATH0 Source Select' From SDI0"
        cset "name='SAI1 Receive PATH1 Source Select' From SDI1"
        cset "name='SAI1 Receive PATH2 Source Select' From SDI2"

        # Enable OUT1 (headphone), disable OUT2 (speaker)
        cset "name='OUT1 Switch' on"
        cset "name='OUT2 Switch' off"
    ]

    DisableSequence [
        # Usually empty in multi-device mode as 'Speaker' EnableSequence will handle the override
        # exec "/bin/sh -c \"echo '[UCM] Disabling Headphones' > /dev/kmsg\""
    ]
}

# Define Speaker Device (Handles the Unplugged/Default state)
SectionDevice."Speaker" {
    Comment "Speaker Output"

    Value {
        PlaybackPriority 100
    }

    EnableSequence [
        # exec "/bin/sh -c \"echo '[UCM] Switching to Speaker: Disabling Mic, OUT1, and Restoring SDI' > /dev/kmsg\""

        # Mute microphone logic switch
        cset "name='Headset Mic Switch' off"

        # Restore SDI mapping order for Speaker/Default mode
        cset "name='SAI1 Receive PATH0 Source Select' From SDI1"
        cset "name='SAI1 Receive PATH1 Source Select' From SDI2"
        cset "name='SAI1 Receive PATH2 Source Select' From SDI0"

        # Enable OUT2 (speaker), disable OUT1 (headphone)
        cset "name='OUT2 Switch' on"
        cset "name='OUT1 Switch' off"
    ]

    DisableSequence [
        # exec "/bin/sh -c \"echo '[UCM] Disabling Speaker' > /dev/kmsg\""
    ]
}
